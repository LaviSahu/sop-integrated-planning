[project]
name = "sop-integrated-planning"
version = "0.1.0"
description = "An S&OP / IBP decision cockpit: base vs upside vs constrained, what do we commit, and what does it cost — for a synthetic appliance manufacturer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lavi Sahu" }]
keywords = ["s&op", "ibp", "sales-and-operations-planning", "rccp", "capacity-planning", "dashboard"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/lavisahu/sop-integrated-planning"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
